name: UrbanPiper Automated Reports

on:
  # Triggered by cron-job.org (2 jobs):
  #   Job 1 — every day at 02:30 UTC (8:00 AM IST) -> mode: daily
  #   Job 2 — cron 30 3 1 * 1  (Mon + 1st of month, 9:00 AM IST) -> mode: auto
  # For manual testing, trigger from the Actions tab and pick a mode below.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Report mode to run'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - auto
          - weekly
          - monthly
          - smart
          - test

jobs:
  send-reports:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Run full automation (generate -> download -> process -> email)
        env:
          UP_EMAIL:          ${{ secrets.UP_EMAIL }}
          UP_PASSWORD:       ${{ secrets.UP_PASSWORD }}
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          GMAIL_TOKEN:       ${{ secrets.GMAIL_TOKEN }}
          NORTH_EMAIL:       ${{ secrets.NORTH_EMAIL }}
          SOUTH_EMAIL:       ${{ secrets.SOUTH_EMAIL }}
          WEST_EMAIL:        ${{ secrets.WEST_EMAIL }}
        run: python run_automation.py ${{ github.event.inputs.mode || 'smart' }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: automation-failure-log
          path: |
            automation.log
            login_debug.png
            login_step1_loaded.png
            login_step2_email_filled.png
            login_step3_pwd_visible.png
            login_step4_success.png
          if-no-files-found: ignore
          retention-days: 7
